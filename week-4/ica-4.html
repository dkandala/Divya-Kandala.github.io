<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://use.typekit.net/rca4igs.css">
    <style>
        html {
        font-family: "dunhill-script", sans-serif;
        font-weight: 600;
        font-style: normal;
        }


        .flex {
            display:flex;
            flex-direction:row;
        }

        .color-box{
            height:150px;
            width:150px;
        }

        #box1 {
            background-color: #A82E5B;
        }
        #box2 {
            background-color: #6A7FDB;
        }
        #box3 {
            background-color: #1A5E63;
        }
        #box4 {
            background-color: #309574;
        }

        p{
            font-size: 20px;
        }

        .small-text {
            font-size: 16px;
        }

        h3 {
            font-size: 20px;
        }

        h2{
            font-size: 24px;
        }

        h1{
            font-size: 30px;
        }

        a{
            text-decoration: none;
            color: #A82E5B;
        }

        .button{
             background-color: #A82E5B;
             border: none;
             color: white; 
             padding: 16px 32px;
             text-align: center;
             text-decoration: none;
             display: inline-block;
             font: size 16px;
             margin: 4px 2px;
             transition-duration: 0.4s;
             cursor: pointer;
            }
        .button:hover {
            background-color: #6A7FDB; 
            color: black;
        }
            

        a:hover {
            text-decoration: underline;
            color: #6A7FDB; 
        }

        a:visited {
            color:#1A5E63;
        }
    </style>

    <style>
         .rdp {
            --rdp-cell-size: 40px;
            --rdp-accent-color: #000000;
            --rdp-background-color:#e7edff;
            --rdp-accent-color-dark: #000000;
            --rdp-background-color-dark: #180270;
            --rdp-outline: 2px solid var(--rdp-accent-color); /*Outline border for focused elements */
            --rdp-outline-selected: 2px solid rgba(0,0,0,0.75); /*
            Outline border for focused _and_ selected elements */ 
            margin: lem;
         }
        </style>
</head>

<body>
    <div class="flex">
        <div class="color-box" id="box1">#A82E5B</div>
        <div class="color-box" id="box2">#6A7FDB</div>
        <div class="color-box" id="box3">#1A5E63</div>
        <div class="color-box" id="box4">#309574</div>
    </div>

    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <h3>This is heading 3</h3>
    <p>This is paragraph text</p>
    <p class ="small-text">This is small text</p>
    <p>
        <a href="ica-4.html">This is a link</a>
    </p>
    <div>
        <button class="button">This is a button!</button>
    </div>
</body>
</html>
