<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://use.typekit.net/vxg0gza.css">
    <style>
        html {
            font-family: "proxima-nova", sans-serif;
        }
        .color-box{
            height:75px;
            width:75px;
        }
        #box1 {
            background-color: #7F055F;
        }
        #box2 {
            background-color: #6C9A8B;
        }
        #box3 {
            background-color: #C6B9CD;
        }
        #box4 {
            background-color: #0C437E;
        }

        p{
            font-size: 16px;
        }

        .small-text {
            font-size: 12px;
        }

        h3 {
            font-size: 12px;
        }

        h2{
            font-size: 20px;
        }

        h1{
            font-size: 24px;
        }

        a{
            text-decoration: none;
            color: #0C437E;
        }
        a:hover {
            text-decoration: underline;
            color: #7F055F; 
        }

        a:visited {
            color:#C6B9CD
        }
    </style>
    <style>
        .rdp {
            --rdp-cell-size: 40px;
            --rdp-accent-color: #0000ff;
            --rdp-background-color:#e7edff;
            --rdp-accent-color-dark: #3003e1;
            --rdp-background-color-dark: #180270;
            --rdp-outline: 2px solid var(var(--rdp-accent-color); /*Outline border for focused elements */
            --rdp-outline-selected: 2px solid rgba(0,0,0,0.75); /*
        Outline border for focused _and_ selected elements */ 
            margin: lem;
        }
    </style>
</head>
<body>
    <div class="flex">
        <div class="color-box" id="box1">1</div>
        <div class="color-box" id="box2">2</div>
        <div class="color-box" id="box3">3</div>
        <div class="color-box" id="box4">4</div>
    </div>

    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <h3>This is heading 3</h3>
    <p>This is paragraph text</p>
    <p class ="small-text">This is small text</p>
    <p> == $0</p>
</body>
</html>
