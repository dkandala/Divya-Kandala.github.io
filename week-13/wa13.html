<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="wa13.css">
    <title>King County Library System</title>
</head>
<body>
    <header>
        <h1>Book Retriever</h1>
        <input type="text" id="search-input" placeholder="Search for an author...">
        <button id="search-button">Search</button>
    </header>
    <main>
        <div class = "results-section">
            <h3>Search Results:</h3>
            <div id ="results"></div>
            <ul id="results-list"></ul>
            <button id="clearBtn">Clear Results</button>
            <button id="exportBtn">Export Results</button>
        </div>
    </main>
    <footer>
        <p id="privacy-policy">This is a disclaimer that all results are stored in local Storage and can be cleared by the user if needed</p>
    </footer>
    <script src="wa13.js"></script>
    
</body>
</html>
