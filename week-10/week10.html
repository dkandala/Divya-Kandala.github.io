<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href="wa10.css">
    
    <title>Live Laugh Love the Bible!</title>
</head>
<body>
    <div class="app">
        <header>Guess The Bible Verses </header>
        <div class="lll"><h3>Live Laugh Love!</h3></div>
        <div class="quotes">
          <div class="quote-text" id="js-quote-text"></div>
          <div class="quote-text" id="js-answer-text"></div>
        </div>
        <div class="controls" >
          <button type="button" id="js-new-quote" class="new-quote button">
            Generate a new bible verse!
          </button>
          <button type="button" id="js-tweet" class="twitter button">
            Show me the answer!
          </button>
          <!-- <a class="answer button" id="js-tweet" target="_blank" rel="noreferrer">Show me the answer!</a> -->
        </div>
      </div>

      <footer>
        <div class="quote-counter">
          Quotes generated: <span id="js-quote-count">0</span>
        </div>
      </footer>

      <script src="wa10.js"></script>

  
</body>
</html>
